<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 主背景渐变：深海蓝 -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D68E8"/>
      <stop offset="0.55" stop-color="#1F50C7"/>
      <stop offset="1" stop-color="#102B6E"/>
    </linearGradient>

    <!-- 内部辉光 -->
    <radialGradient id="innerGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7AA6FF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#2D68E8" stop-opacity="0"/>
    </radialGradient>

    <!-- 熔岩橙渐变 -->
    <linearGradient id="moltenGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6E40"/>
      <stop offset="1" stop-color="#FFB07A"/>
    </linearGradient>

    <!-- 玻璃高光 -->
    <linearGradient id="glassShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 圆角蒙版 (macOS Big Sur+) -->
    <clipPath id="macosClip">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <g clip-path="url(#macosClip)">
    <rect width="1024" height="1024" fill="url(#bgGradient)"/>
    <rect width="1024" height="1024" fill="url(#innerGlow)"/>

    <!-- 背景原子轨道装饰 -->
    <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" fill="none">
      <ellipse cx="512" cy="512" rx="380" ry="160" transform="rotate(0 512 512)"/>
      <ellipse cx="512" cy="512" rx="380" ry="160" transform="rotate(60 512 512)"/>
      <ellipse cx="512" cy="512" rx="380" ry="160" transform="rotate(120 512 512)"/>
    </g>

    <!-- 中心原子核：熔盐粒子 -->
    <g transform="translate(512 512)">
      <!-- 外环 -->
      <circle r="280" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.15"/>

      <!-- 主圆 -->
      <circle r="220" fill="#FFFFFF" opacity="0.06"/>
      <circle r="220" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>

      <!-- 内部核 -->
      <circle r="120" fill="url(#moltenGradient)"/>
      <circle r="120" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.4"/>

      <!-- 中心高光 -->
      <ellipse cx="-30" cy="-40" rx="50" ry="35" fill="#FFFFFF" opacity="0.4"/>

      <!-- 围绕粒子（4个气泡） -->
      <g>
        <!-- 顶部 -->
        <circle cx="0" cy="-220" r="22" fill="#FFFFFF"/>
        <circle cx="0" cy="-220" r="22" fill="none" stroke="#2D68E8" stroke-width="3"/>
        <!-- 右 -->
        <circle cx="220" cy="0" r="22" fill="#FFFFFF"/>
        <circle cx="220" cy="0" r="22" fill="none" stroke="#2D68E8" stroke-width="3"/>
        <!-- 底 -->
        <circle cx="0" cy="220" r="22" fill="url(#moltenGradient)"/>
        <circle cx="0" cy="220" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        <!-- 左 -->
        <circle cx="-220" cy="0" r="22" fill="url(#moltenGradient)"/>
        <circle cx="-220" cy="0" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      </g>

      <!-- 数据点装饰 (表示测量) -->
      <g fill="#FFFFFF" opacity="0.6">
        <circle cx="-310" cy="-150" r="4"/>
        <circle cx="-280" cy="-200" r="3"/>
        <circle cx="-340" cy="-110" r="3"/>
        <circle cx="310" cy="150" r="4"/>
        <circle cx="280" cy="200" r="3"/>
        <circle cx="340" cy="110" r="3"/>
      </g>
    </g>

    <!-- 顶部玻璃高光 -->
    <path d="M 0 0 L 1024 0 L 1024 480 Q 512 600 0 480 Z" fill="url(#glassShine)"/>
  </g>

  <!-- 边框光晕 -->
  <rect x="2" y="2" width="1020" height="1020" rx="223" ry="223" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.15"/>
</svg>
