<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D68E8"/>
      <stop offset="0.55" stop-color="#1F50C7"/>
      <stop offset="1" stop-color="#102B6E"/>
    </linearGradient>
    <linearGradient id="moltenGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6E40"/>
      <stop offset="1" stop-color="#FFB07A"/>
    </linearGradient>
    <clipPath id="macosClip">
      <rect width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#macosClip)">
    <rect width="256" height="256" fill="url(#bgGradient)"/>

    <g transform="translate(128 128)">
      <circle r="56" fill="#FFFFFF" opacity="0.08"/>
      <circle r="56" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
      <circle r="30" fill="url(#moltenGradient)"/>
      <ellipse cx="-7" cy="-10" rx="12" ry="8" fill="#FFFFFF" opacity="0.4"/>

      <g>
        <circle cx="0" cy="-55" r="5.5" fill="#FFFFFF"/>
        <circle cx="55" cy="0" r="5.5" fill="#FFFFFF"/>
        <circle cx="0" cy="55" r="5.5" fill="url(#moltenGradient)"/>
        <circle cx="-55" cy="0" r="5.5" fill="url(#moltenGradient)"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="255" height="255" rx="55.5" ry="55.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
</svg>
