<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D68E8"/>
      <stop offset="0.55" stop-color="#1F50C7"/>
      <stop offset="1" stop-color="#102B6E"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7AA6FF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#2D68E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moltenGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6E40"/>
      <stop offset="1" stop-color="#FFB07A"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="macosClip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#macosClip)">
    <rect width="512" height="512" fill="url(#bgGradient)"/>
    <rect width="512" height="512" fill="url(#innerGlow)"/>

    <g opacity="0.12" stroke="#FFFFFF" stroke-width="1" fill="none">
      <ellipse cx="256" cy="256" rx="190" ry="80" transform="rotate(0 256 256)"/>
      <ellipse cx="256" cy="256" rx="190" ry="80" transform="rotate(60 256 256)"/>
      <ellipse cx="256" cy="256" rx="190" ry="80" transform="rotate(120 256 256)"/>
    </g>

    <g transform="translate(256 256)">
      <circle r="140" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.15"/>
      <circle r="110" fill="#FFFFFF" opacity="0.06"/>
      <circle r="110" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <circle r="60" fill="url(#moltenGradient)"/>
      <circle r="60" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
      <ellipse cx="-15" cy="-20" rx="25" ry="17" fill="#FFFFFF" opacity="0.4"/>

      <g>
        <circle cx="0" cy="-110" r="11" fill="#FFFFFF"/>
        <circle cx="0" cy="-110" r="11" fill="none" stroke="#2D68E8" stroke-width="1.5"/>
        <circle cx="110" cy="0" r="11" fill="#FFFFFF"/>
        <circle cx="110" cy="0" r="11" fill="none" stroke="#2D68E8" stroke-width="1.5"/>
        <circle cx="0" cy="110" r="11" fill="url(#moltenGradient)"/>
        <circle cx="0" cy="110" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="-110" cy="0" r="11" fill="url(#moltenGradient)"/>
        <circle cx="-110" cy="0" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>
    </g>

    <path d="M 0 0 L 512 0 L 512 240 Q 256 300 0 240 Z" fill="url(#glassShine)"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="111" ry="111" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
</svg>
