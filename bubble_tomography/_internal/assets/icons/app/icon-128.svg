<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D68E8"/>
      <stop offset="1" stop-color="#102B6E"/>
    </linearGradient>
    <linearGradient id="moltenGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6E40"/>
      <stop offset="1" stop-color="#FFB07A"/>
    </linearGradient>
    <clipPath id="macosClip">
      <rect width="128" height="128" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#macosClip)">
    <rect width="128" height="128" fill="url(#bgGradient)"/>

    <g transform="translate(64 64)">
      <circle r="28" fill="#FFFFFF" opacity="0.08"/>
      <circle r="28" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
      <circle r="15" fill="url(#moltenGradient)"/>

      <g>
        <circle cx="0" cy="-27" r="3" fill="#FFFFFF"/>
        <circle cx="27" cy="0" r="3" fill="#FFFFFF"/>
        <circle cx="0" cy="27" r="3" fill="url(#moltenGradient)"/>
        <circle cx="-27" cy="0" r="3" fill="url(#moltenGradient)"/>
      </g>
    </g>
  </g>
</svg>
